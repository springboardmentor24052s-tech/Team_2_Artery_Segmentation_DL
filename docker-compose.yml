# =============================================================================
# docker-compose.yml — Artery Stenosis Detection Backend
# =============================================================================
# Usage:
#   docker compose up -d
#   docker compose down
# =============================================================================

services:
  # ----------------------------------------------------------------
  # PostgreSQL Database
  # ----------------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: artery-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: artery_db_password
      POSTGRES_DB: artery_db
    ports:
      - "5432:5432"
    volumes:
      - artery-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d artery_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ----------------------------------------------------------------
  # FastAPI Backend
  # ----------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: artery-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:artery_db_password@db:5432/artery_db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change_this_to_a_secure_random_secret_key_at_least_32_chars}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - ENVIRONMENT=production
      - ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - PYTHONPATH=/app/backend
      - PORT=8000
    volumes:
      - artery-uploads:/app/uploads/images
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

# ----------------------------------------------------------------
# Volumes
# ----------------------------------------------------------------
volumes:
  artery-db-data:
  artery-uploads:
